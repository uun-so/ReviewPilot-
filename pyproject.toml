[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "reviewpilot"
version = "0.2.2"
description = "Evidence-gated claim verification for AI-written technical articles"
readme = "README.md"
requires-python = ">=3.13"
keywords = ["verification", "retrieval", "citations", "technical-writing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "openai>=3.51,<4",
    "pydantic>=2.14,<3",
    "typer>=0.29,<1",
    "rich>=13,<15",
    "jieba>=0.42,<1",
    "beautifulsoup4>=4.15,<5",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.163,<1",
    "uvicorn[standard]>=0.54,<1",
]
dev = [
    "pytest>=9,<10",
    "respx>=0.23,<1",
    "build>=1.2,<2",
    "fastapi>=0.163,<1",
    "uvicorn[standard]>=0.54,<1",
    "httpx>=0.28,<1",
]

[project.scripts]
reviewpilot = "reviewpilot.cli:run"
reviewpilot-api = "reviewpilot_api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewpilot", "src/reviewpilot_api"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/scripts",
    "/web",
    "/README.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
]
exclude = ["/web/node_modules", "/web/dist", "/web/*.tsbuildinfo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
